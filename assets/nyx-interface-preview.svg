<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Glow -->
    <radialGradient id="canvasGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1f2335" />
      <stop offset="100%" stop-color="#0e1017" />
    </radialGradient>

    <!-- Window Drop Shadow -->
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Subtle Blur Filter for Neon Glow -->
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="activeTabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24283b" />
      <stop offset="100%" stop-color="#1a1b26" />
    </linearGradient>

    <linearGradient id="cursorGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dcfff" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
    .dim { fill: #565f89; }
    .text { fill: #c0caf5; }
    .cyan { fill: #7dcfff; }
    .green { fill: #9ece6a; }
    .magenta { fill: #bb9af7; }
    .yellow { fill: #e0af68; }
    .blue { fill: #7aa2f7; }
    .coral { fill: #f7768e; }
  </style>

  <!-- Canvas Backdrop -->
  <rect width="920" height="580" rx="16" fill="url(#canvasGlow)" />
  <rect width="920" height="580" rx="16" fill="none" stroke="#24283b" stroke-width="1.5" />

  <!-- Ambient Lights -->
  <circle cx="200" cy="120" r="140" fill="#7dcfff" opacity="0.04" filter="url(#neonBlur)" />
  <circle cx="720" cy="420" r="160" fill="#bb9af7" opacity="0.05" filter="url(#neonBlur)" />

  <!-- MAIN NYX TERMINAL WINDOW -->
  <g transform="translate(36, 28)" filter="url(#winShadow)">
    <!-- Window Frame -->
    <rect width="848" height="520" rx="10" fill="#1a1b26" stroke="#2f354f" stroke-width="1.5" />

    <!-- TOP TITLE / TAB BAR -->
    <rect width="848" height="40" rx="10" fill="#13141f" />
    <!-- Straighten bottom corners of header -->
    <rect y="30" width="848" height="10" fill="#13141f" />
    <line x1="0" y1="40" x2="848" y2="40" stroke="#24283b" stroke-width="1" />

    <!-- Window Controls (Windows 11 clean style) -->
    <g transform="translate(776, 12)">
      <circle cx="12" cy="8" r="6" fill="#f7768e" opacity="0.8" />
      <circle cx="32" cy="8" r="6" fill="#e0af68" opacity="0.8" />
      <circle cx="52" cy="8" r="6" fill="#9ece6a" opacity="0.8" />
    </g>

    <!-- Tab 1 (Active) -->
    <g transform="translate(48, 6)">
      <path d="M0 4 C0 2 2 0 4 0 L156 0 C158 0 160 2 160 4 L160 34 L0 34 Z" fill="url(#activeTabGrad)" stroke="#24283b" stroke-width="0.5" />
      <!-- Active tab indicator line -->
      <line x1="0" y1="33" x2="160" y2="33" stroke="#7dcfff" stroke-width="2" />
      <circle cx="18" cy="17" r="4" fill="#7dcfff" />
      <text x="32" y="21" class="sans" font-size="12" font-weight="600" fill="#c0caf5">PowerShell 7</text>
      <text x="142" y="21" class="sans dim" font-size="12">×</text>
    </g>

    <!-- Tab 2 (Inactive) -->
    <g transform="translate(214, 6)">
      <rect width="130" height="34" rx="4" fill="transparent" />
      <circle cx="16" cy="17" r="3.5" fill="#565f89" />
      <text x="28" y="21" class="sans dim" font-size="12">Git Bash</text>
      <text x="114" y="21" class="sans dim" font-size="12">×</text>
    </g>

    <!-- Tab 3 (Inactive - WSL) -->
    <g transform="translate(350, 6)">
      <rect width="120" height="34" rx="4" fill="transparent" />
      <circle cx="16" cy="17" r="3.5" fill="#565f89" />
      <text x="28" y="21" class="sans dim" font-size="12">Ubuntu-24.04</text>
      <text x="104" y="21" class="sans dim" font-size="12">×</text>
    </g>

    <!-- Add Tab Button '+' -->
    <text x="480" y="27" class="sans dim" font-size="18" font-weight="300" style="cursor: pointer;">+</text>

    <!-- Quake Mode Pill Badge in Top Bar -->
    <g transform="translate(620, 10)">
      <rect width="126" height="20" rx="10" fill="#24283b" stroke="#3b4261" stroke-width="1" />
      <circle cx="10" cy="10" r="3" fill="#9ece6a" />
      <text x="20" y="14" class="sans" font-size="10.5" font-weight="600" fill="#7aa2f7">Quake: Ctrl+` (Ready)</text>
    </g>

    <!-- LEFT SHORTCUT RAIL (Nyx customizable icons) -->
    <g transform="translate(0, 40)">
      <rect width="46" height="480" fill="#13141f" />
      <line x1="46" y1="0" x2="46" y2="480" stroke="#24283b" stroke-width="1" />

      <!-- Rail Icon 1 (Nyx Logo / Home) -->
      <g transform="translate(13, 16)">
        <rect width="20" height="20" rx="5" fill="#7dcfff" fill-opacity="0.15" />
        <path d="M4 6 L10 10 L4 14" stroke="#7dcfff" stroke-width="1.8" fill="none" stroke-linecap="round" />
        <line x1="10" y1="14" x2="16" y2="14" stroke="#7dcfff" stroke-width="1.8" stroke-linecap="round" />
      </g>

      <!-- Rail Icon 2 (@github shortcut) -->
      <g transform="translate(13, 56)">
        <rect width="20" height="20" rx="5" fill="#24283b" />
        <text x="4" y="15" class="sans" font-size="11" font-weight="700" fill="#bb9af7">gh</text>
      </g>

      <!-- Rail Icon 3 (@tibet project shortcut) -->
      <g transform="translate(13, 96)">
        <rect width="20" height="20" rx="5" fill="#24283b" />
        <text x="5" y="15" class="sans" font-size="11" font-weight="700" fill="#9ece6a">tb</text>
      </g>

      <!-- Rail Icon 4 (Star / Favorites) -->
      <g transform="translate(13, 136)">
        <path d="M10 3 L12.5 8 L18 8.8 L14 12.7 L15 18 L10 15.3 L5 18 L6 12.7 L2 8.8 L7.5 8 Z" fill="#e0af68" opacity="0.8" />
      </g>

      <!-- Rail Bottom: Settings Gear Icon -->
      <g transform="translate(13, 436)">
        <circle cx="10" cy="10" r="5" fill="none" stroke="#565f89" stroke-width="2" />
        <path d="M10 2 L10 5 M10 15 L10 18 M2 10 L5 10 M15 10 L18 10 M4.5 4.5 L6.5 6.5 M13.5 13.5 L15.5 15.5 M4.5 15.5 L6.5 13.5 M13.5 4.5 L15.5 6.5" stroke="#565f89" stroke-width="2" />
      </g>
    </g>

    <!-- TERMINAL BODY SPLIT AREA -->
    <!-- Left Pane (Active Split) -->
    <g transform="translate(56, 52)">
      <!-- Prompt Line 1 -->
      <text x="10" y="24" class="mono">
        <tspan class="blue">nyx</tspan><tspan class="dim"> in </tspan><tspan class="cyan">~/Desktop/Gloria/Nyx</tspan><tspan class="dim"> on </tspan><tspan class="magenta">git:main</tspan>
      </text>
      <text x="10" y="44" class="mono">
        <tspan class="green">❯</tspan><tspan class="text"> git status -s</tspan>
      </text>
      <text x="10" y="66" class="mono dim"> M </text><text x="32" y="66" class="mono cyan">src/term/snapshot.rs</text>
      <text x="10" y="84" class="mono green"> A </text><text x="32" y="84" class="mono cyan">assets/nyx-icon.svg</text>

      <!-- Command 2 -->
      <text x="10" y="118" class="mono">
        <tspan class="green">❯</tspan><tspan class="text"> cargo test -- --nocapture</tspan>
      </text>
      <text x="10" y="138" class="mono dim">   Compiling nyx v0.1.0 (wgpu low_latency vsync)</text>
      <text x="10" y="156" class="mono text">   running 449 tests in 74 modules...</text>
      <text x="10" y="174" class="mono">
        <tspan class="green">test result: ok.</tspan><tspan class="text"> 449 passed; 0 failed; 0 ignored; finished in </tspan><tspan class="yellow">2.84s</tspan>
      </text>

      <!-- Command 3: Sigil Expansion with Live Completion Overlay -->
      <text x="10" y="214" class="mono">
        <tspan class="blue">nyx</tspan><tspan class="dim"> in </tspan><tspan class="cyan">~/Desktop/Gloria/Nyx</tspan>
      </text>
      <text x="10" y="234" class="mono">
        <tspan class="green">❯</tspan><tspan class="text"> cd </tspan><tspan class="cyan" font-weight="700">@</tspan>
      </text>
      
      <!-- Blinking Cursor -->
      <rect x="52" y="222" width="8" height="15" fill="url(#cursorGlow)" rx="1.5" />

      <!-- NYX SIGIL COMPLETION OVERLAY MENU (Popup at cursor) -->
      <g transform="translate(48, 244)" filter="url(#winShadow)">
        <rect width="320" height="152" rx="8" fill="#1f2335" stroke="#3b4261" stroke-width="1.5" />
        
        <!-- Header -->
        <rect width="320" height="24" rx="8" fill="#161622" />
        <rect y="16" width="320" height="8" fill="#161622" />
        <text x="12" y="17" class="sans dim" font-size="10" font-weight="700">NYX SHORTCUT COMPLETIONS (Tab / Enter)</text>
        <line x1="0" y1="24" x2="320" y2="24" stroke="#292e42" stroke-width="1" />

        <!-- Row 1: Selected -->
        <g transform="translate(0, 24)">
          <rect width="320" height="30" fill="#283457" />
          <line x1="0" y1="0" x2="3" y2="30" stroke="#7dcfff" stroke-width="3" />
          <text x="14" y="20" class="mono cyan" font-size="12" font-weight="700">@nyx</text>
          <text x="76" y="20" class="mono dim" font-size="11">C:\Users\Nihil\Desktop\Gloria\Nyx</text>
        </g>

        <!-- Row 2 -->
        <g transform="translate(0, 54)">
          <text x="14" y="20" class="mono text" font-size="12">@tibet</text>
          <text x="76" y="20" class="mono dim" font-size="11">C:\Users\Nihil\Desktop\Gloria\Tibet</text>
        </g>

        <!-- Row 3 -->
        <g transform="translate(0, 84)">
          <text x="14" y="20" class="mono text" font-size="12">@rust</text>
          <text x="76" y="20" class="mono dim" font-size="11">%USERPROFILE%\.cargo\bin</text>
        </g>

        <!-- Row 4 -->
        <g transform="translate(0, 114)">
          <text x="14" y="20" class="mono text" font-size="12">@docs</text>
          <text x="76" y="20" class="mono dim" font-size="11">%USERPROFILE%\Documents</text>
        </g>
      </g>
    </g>

    <!-- VERTICAL SPLIT GUTTER (Draggable gutter) -->
    <line x1="470" y1="40" x2="470" y2="520" stroke="#24283b" stroke-width="2" />
    <circle cx="470" cy="270" r="3" fill="#565f89" />

    <!-- Right Pane (Split 2 - Live Telemetry & Process Monitor) -->
    <g transform="translate(484, 52)">
      <!-- Sub-header -->
      <rect width="350" height="26" rx="4" fill="#161622" />
      <text x="10" y="17" class="mono" font-size="11"><tspan class="yellow">⚡ Nyx Engine Telemetry</tspan><tspan class="dim"> (NYX_PERF=1)</tspan></text>
      
      <g transform="translate(10, 44)">
        <text x="0" y="0" class="mono dim" font-size="11.5">Renderer:</text>
        <text x="110" y="0" class="mono cyan" font-size="11.5">wgpu (DirectX 12 Hardware)</text>

        <text x="0" y="22" class="mono dim" font-size="11.5">Typing Latency:</text>
        <text x="110" y="22" class="mono green" font-size="11.5" font-weight="700">0.14 ms (Direct event pass)</text>

        <text x="0" y="44" class="mono dim" font-size="11.5">Throughput Cap:</text>
        <text x="110" y="44" class="mono text" font-size="11.5">60 Hz RepaintCoalescer</text>

        <text x="0" y="66" class="mono dim" font-size="11.5">Idle CPU Cost:</text>
        <text x="110" y="66" class="mono green" font-size="11.5">0.00% (Event-driven sleep)</text>

        <text x="0" y="88" class="mono dim" font-size="11.5">Grid Shaper:</text>
        <text x="110" y="88" class="mono magenta" font-size="11.5">glyphon cosmic-text (GPU)</text>

        <text x="0" y="110" class="mono dim" font-size="11.5">ConPTY Channel:</text>
        <text x="110" y="110" class="mono text" font-size="11.5">Alacritty VT + Kitty Protocol</text>

        <text x="0" y="132" class="mono dim" font-size="11.5">Active Config:</text>
        <text x="110" y="132" class="mono yellow" font-size="11.5">%APPDATA%\Nyx\config.toml</text>
      </g>

      <!-- Horizontal Sub-split in Right Pane -->
      <line x1="-14" y1="210" x2="364" y2="210" stroke="#24283b" stroke-width="1" />
      
      <g transform="translate(10, 230)">
        <text x="0" y="0" class="mono dim" font-size="11.5"># Click-to-copy code blocks (Ctrl+Shift+C)</text>
        <rect x="0" y="12" width="340" height="64" rx="6" fill="#13141f" stroke="#24283b" stroke-width="1" />
        <text x="12" y="34" class="mono cyan" font-size="11">$ curl -sLO https://get.nyx.sh</text>
        <text x="12" y="52" class="mono green" font-size="11">$ ./install.ps1 -AddToPath</text>
        <rect x="290" y="20" width="40" height="20" rx="3" fill="#24283b" />
        <text x="298" y="34" class="sans dim" font-size="10">COPY</text>
      </g>

      <!-- Live Frame Stats Chart Mini -->
      <g transform="translate(10, 326)">
        <text x="0" y="0" class="mono dim" font-size="11">Frame Pipeline: <tspan class="green">16.6ms Target (Vsync Locked)</tspan></text>
        <rect x="0" y="10" width="340" height="8" rx="4" fill="#161622" />
        <rect x="0" y="10" width="60" height="8" rx="4" fill="#7dcfff" />
        <rect x="62" y="10" width="45" height="8" rx="0" fill="#9ece6a" />
        <rect x="109" y="10" width="30" height="8" rx="0" fill="#bb9af7" />
        <text x="0" y="32" class="sans dim" font-size="10">■ Snapshot: 0.08ms   ■ Quads: 0.12ms   ■ Glyphon: 0.22ms</text>
      </g>
    </g>

    <!-- BOTTOM STATUS BAR -->
    <g transform="translate(46, 492)">
      <line x1="0" y1="0" x2="802" y2="0" stroke="#24283b" stroke-width="1" />
      <rect width="802" height="28" fill="#13141f" />
      <circle cx="16" cy="14" r="4" fill="#9ece6a" />
      <text x="28" y="18" class="sans dim" font-size="11"><tspan fill="#c0caf5" font-weight="600">Nyx v0.1.0</tspan> — Ready</text>
      <text x="260" y="18" class="sans dim" font-size="11">Theme: <tspan fill="#7dcfff">Tokyo Night</tspan></text>
      <text x="440" y="18" class="sans dim" font-size="11">Font: <tspan fill="#c0caf5">Cascadia Code 13pt</tspan></text>
      <text x="640" y="18" class="sans dim" font-size="11">DPI: <tspan fill="#bb9af7">PerMonitorV2 (100%)</tspan></text>
    </g>
  </g>
</svg>
