<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- Background Midnight Gradient -->
    <linearGradient id="nyxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e17" />
      <stop offset="50%" stop-color="#141726" />
      <stop offset="100%" stop-color="#1a1b2e" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dcfff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff007c" stop-opacity="0.3" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dcfff" />
      <stop offset="60%" stop-color="#bb9af7" />
      <stop offset="100%" stop-color="#7aa2f7" />
    </linearGradient>

    <!-- Radial Nebula -->
    <radialGradient id="nebula" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#7dcfff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#141726" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadows -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#nyxBg)" stroke="url(#borderGrad)" stroke-width="2.5" />
  
  <!-- Inner Ambient Nebula -->
  <circle cx="128" cy="128" r="95" fill="url(#nebula)" />

  <!-- Subtle Concentric Orbit Guide -->
  <circle cx="128" cy="128" r="78" stroke="#7dcfff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="3 5" />

  <!-- Crescent Moon of Nyx (Goddess of Night) -->
  <path d="M148 58 C96 66 64 110 66 160 C68 200 98 226 138 226 C112 214 96 186 96 154 C96 112 124 76 162 62 C157 60 152 59 148 58 Z"
        fill="url(#neonGlow)" fill-opacity="0.16" stroke="url(#neonGlow)" stroke-width="3" stroke-linejoin="round" />

  <!-- The Terminal Chevron Prompt `>` (Speed & Execution) -->
  <path d="M96 98 L146 130 L96 162" 
        stroke="url(#neonGlow)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glowFilter)" />

  <!-- The Terminal Cursor Underscore `_` -->
  <line x1="140" y1="162" x2="176" y2="162"
        stroke="#7dcfff" stroke-width="10" stroke-linecap="round"
        filter="url(#glowFilter)" />

  <!-- North Star / Starlight Sigil Spark at Apex -->
  <g transform="translate(178, 86)">
    <path d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z" fill="#7dcfff" filter="url(#glowFilter)" />
    <circle cx="0" cy="0" r="2" fill="#ffffff" />
  </g>
</svg>
